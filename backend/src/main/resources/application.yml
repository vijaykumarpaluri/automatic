spring:
  application:
    name: plant-ecommerce-backend
  datasource:
    url: jdbc:mysql://localhost:3306/plant_ecommerce
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: your_secret_key_here_make_it_long_and_secure
  expiration: 86400000
